name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: APK derle
        run: gradle assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk ShortsSayaci.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShortsSayaci
          path: ShortsSayaci.apk

      - name: Sürüm notlarını hazırla
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VER=$VER" >> $GITHUB_ENV
          # CHANGELOG.md'deki en üstteki sürüm bölümünü al
          awk '/^## /{n++} n==1' CHANGELOG.md | tail -n +2 > notes.md
          printf '\n---\n📥 Telefondan aşağıdaki **ShortsSayaci.apk** dosyasına dokunup indir ve eskisinin üstüne kur (veriler korunur).\n' >> notes.md

      - name: Release oluştur (telefondan kolay indirme için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shorts Sayacı v${{ env.VER }} (derleme ${{ github.run_number }})
          body_path: notes.md
          files: ShortsSayaci.apk
          make_latest: true
